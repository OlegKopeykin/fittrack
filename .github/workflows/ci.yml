name: CI

# Тесты — только на push в рабочие ветки. main защищён (strict: ветка должна быть
# актуальной и пройти все проверки), поэтому после слияния тесты не повторяются:
# deploy.yml сразу собирает и выкатывает.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

# Новый push в ветку отменяет незавершённый прогон той же ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...

  web:
    name: Web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run --coverage

  # Веб собирается один раз, из него — оба бинаря: релизный (проверка, что
  # собирается) и e2e с тегом e2eseed (детерминированные фикстуры Playwright).
  # Идёт параллельно с unit-тестами: E2E не ждут go/web.
  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build binaries (linux/amd64, embedded SPA)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          ver="$(cat VERSION)"
          go build -tags embedweb -trimpath -ldflags="-s -w -X main.appVersion=$ver" -o fittrack ./cmd/fittrack
          go build -tags "embedweb e2eseed" -trimpath -ldflags="-X main.appVersion=$ver" -o fittrack-e2e ./cmd/fittrack
      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-e2e
          path: fittrack-e2e
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: iphone-15-pro
            browser: webkit
          - project: desktop-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: fittrack-e2e
          path: bin
      - run: mv bin/fittrack-e2e bin/fittrack && chmod +x bin/fittrack
      - run: npm ci
        working-directory: e2e
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright (${{ matrix.browser }})
        working-directory: e2e
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps ${{ matrix.browser }}
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Run E2E
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/playwright-report
          retention-days: 7
